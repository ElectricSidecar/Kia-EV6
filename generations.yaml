generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2021
    end_year: 2024
    description: "The Kia EV6 is the brand's first dedicated electric vehicle built on the Hyundai E-GMP (Electric Global Modular Platform) shared with the Hyundai IONIQ 5 and Genesis GV60. Featuring a distinctive 'Opposites United' design philosophy, it combines crossover-like ground clearance with a sleek, coupe-inspired roofline and dramatic surface treatments. The exterior incorporates aerodynamic elements including a low nose, active air flaps, and a rear spoiler, contributing to a drag coefficient of just 0.28. The unique lighting signature includes a sequential LED pattern at the front and a full-width light bar at the rear. Available with either a 58 kWh Standard Range or 77.4 kWh Long Range battery pack, and in single-motor rear-wheel drive or dual-motor all-wheel drive configurations, power outputs range from 167 HP to 576 HP in the performance-oriented GT model. Range varies by configuration, with up to 310 miles possible in the most efficient variants. One of the EV6's most distinctive features is its 800V electrical architecture that enables ultra-fast DC charging, allowing a 10-80% charge in as little as 18 minutes at compatible charging stations. The interior features a minimalist approach with a curved display combining a 12.3-inch digital instrument cluster and 12.3-inch infotainment touchscreen under a single piece of glass, augmented reality head-up display, and sustainable materials including fabrics made from recycled plastics. Advanced technology includes Vehicle-to-Load (V2L) functionality allowing the car to power external devices or even charge other EVs, remote smart parking assist, and Highway Driving Assist 2 with lane change capabilities. The EV6 GT variant was introduced in October 2022, featuring dual motors producing 576 HP and 740 Nm of torque, capable of 0-100 km/h in 3.5 seconds. It includes performance upgrades like four-piston front calipers, rear electronic limited-slip differential, electronically controlled suspension, and GT-specific 21-inch wheels with neon green brake calipers. The model has received critical acclaim, winning the 2022 European Car of the Year award and multiple other accolades including the 2023 North American Utility Vehicle of the Year."

  - name: "First Generation (Facelift)"
    start_year: 2024
    end_year: null
    description: "The facelifted Kia EV6 was revealed on 14 May 2024, bringing significant exterior and interior updates while retaining the E-GMP platform. Exterior changes include new angular-designed LED headlights and daytime running lights, a redesigned front fascia with a more aggressive Digital Tiger Nose, new alloy wheel designs, and updated rear lighting. The interior receives a revamped curved panoramic screen system, a new steering wheel design with fingerprint authentication system that allows registered drivers to power the electrics without the key, and updated technological features. A major change is the new 84 kWh battery pack that replaces the previous 77.4 kWh unit, offering improved range and efficiency. The GT model continues as the high-performance variant with 576 HP dual-motor setup, unique sports bucket seats with neon green piping, and GT-specific exterior styling. The 800V architecture remains, enabling ultra-fast charging capability. Production continues at Kia's Hwaseong plant in South Korea, with North American market production shifting to the new West Point, Georgia facility starting 2025. The facelift maintains the EV6's position as Kia's flagship electric vehicle while addressing customer feedback and improving overall refinement and technology."